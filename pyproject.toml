[project]
name = "ennovo-compost-widget"
version = "0.1.0"
description = "Monitors composting facility sensor data and displays real-time temperature, moisture, and Oxygen metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=0.4.18",
]

[project.scripts]
export-config = "ennovo_compost_widget.app_config:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
pydoover = { git = "https://github.com/getdoover/pydoover", branch = "doover-2" }
